<!doctypehtml><html lang=en><meta charset=UTF-8><meta content="width=device-width,initial-scale=1"name=viewport><title>Article Open</title><link href=style.css rel=stylesheet><div class=article-container><h1 id=articleTitle>Loading soon</h1><p id=articleBody></div><script>const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        // Fetch and display the specific article based on the ID
        fetch(`https://api.github.com/repos/ReplicantHunter/QUANTUM-VAULT/issues/${articleId}`)
            .then(response => response.json())
            .then(issue => {
                document.getElementById('articleTitle').textContent = issue.title;
                document.getElementById('articleBody').textContent = issue.body;
            })
            .catch(error => {
                console.error('Error fetching the article:', error);
            });</script>
